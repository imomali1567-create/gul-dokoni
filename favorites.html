<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevimlilar — FloraLux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">🌸 FloraLux</a>
            <nav class="nav-links">
                <a href="index.html" data-i18n="nav_home">Bosh sahifa</a>
                <a href="catalog.html" data-i18n="nav_catalog">Katalog</a>
                <a href="favorites.html" class="active" data-i18n="nav_favorites">Sevimlilar</a>
                <a href="about.html" data-i18n="nav_about">Biz haqimizda</a>
                <a href="contact.html" data-i18n="nav_contact">Aloqa</a>
            </nav>
            <div class="nav-actions">
                <select id="lang-select" class="lang-select">
                    <option value="uz">🇺🇿 O'zbek</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="tr">🇹🇷 Türkçe</option>
                    <option value="kk">🇰🇿 Қазақша</option>
                </select>
                <button id="theme-toggle" class="icon-btn">🌙</button>
                <a href="favorites.html" class="icon-btn">
                    ❤️ <span id="fav-badge" class="badge">0</span>
                </a>
                <a href="catalog.html" class="icon-btn">
                    🛒 <span id="cart-badge" class="badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="section-header">
                <h1 class="section-title" data-i18n="fav_title">Sizning sevimli guldastalaringiz</h1>
                <button id="clear-favs-btn" class="btn btn-outline" data-i18n="fav_clear">Ro'yxatni tozalash</button>
            </div>

            <div id="favorites-empty" class="info-card" style="text-align: center; display: none; padding: 60px 20px;">
                <div style="font-size: 56px; margin-bottom: 16px;">💝</div>
                <p style="font-size: 18px; color: var(--text-secondary); margin-bottom: 24px;" data-i18n="fav_empty">
                    Sevimlilar ro'yxati hozircha bo'sh.
                </p>
                <a href="catalog.html" class="btn btn-primary" data-i18n="hero_btn">Katalogni ko'rish</a>
            </div>

            <div id="favorites-grid" class="products-grid"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                © 2026 FloraLux. <span data-i18n="footer_rights">Barcha huquqlar himoyalangan.</span>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
